<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cifrado César</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-light min-vh-100">
    <header class="bg-dark text-white py-4 shadow-sm mb-5">
      <div class="container text-center">
        <h1 class="h2 mb-1">Cifrado César</h1>
        <p class="mb-0 text-white-50">
          Cifra y descifra mensajes con desplazamiento variable
        </p>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8">
            <div class="card shadow border-0">
              <div class="card-body p-4">
                <label for="boxText" class="form-label fw-semibold"
                  >Texto original</label
                >
                <textarea
                  id="boxText"
                  class="form-control mb-3"
                  rows="5"
                  placeholder="Escribe aquí..."
                ></textarea>

                <div class="row g-3 mb-3">
                  <div class="col-sm-6">
                    <label for="desplazamiento" class="form-label fw-semibold"
                      >Desplazamiento</label
                    >
                    <input
                      type="number"
                      id="desplazamiento"
                      class="form-control"
                      value="3"
                      min="0"
                    />
                  </div>
                  <div class="col-sm-6">
                    <label for="operacion" class="form-label fw-semibold"
                      >Operación</label
                    >
                    <select id="operacion" class="form-select">
                      <option value="1">Cifrar (+desplazamiento)</option>
                      <option value="-1">Descifrar (-desplazamiento)</option>
                    </select>
                  </div>
                </div>

                <button
                  id="btnProcesar"
                  type="button"
                  class="btn btn-dark w-100 mb-3"
                >
                  Aplicar
                </button>

                <label for="textoSalida" class="form-label fw-semibold"
                  >Resultado</label
                >
                <textarea
                  id="textoSalida"
                  class="form-control"
                  rows="5"
                  readonly
                ></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="ejercicio3.js"></script>
  </body>
</html>
