<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GestorNotas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
  <nav class="navbar bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand text-white">GestorNotas</a>
      <button type="button" class="btn btn-sm btn-primary" id="btn-add-element">+ Add note
      </button>
    </div>
  </nav>

  <div class="main">
    <div class="row gap-3" id="notes-container">
      <div class="card text-bg-primary mb-3 col-6" id="tarjeta">
        <div class="card-header d-flex align-items-center justify-content-between">
          <h5 class="card-title mb-0">Titulo nota</h5>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-light btn-sm btn-edit-note">editar</button>
            <button type="button" class="btn btn-danger btn-sm btn-delete-note">Borrar</button>
          </div>
        </div>
      </div>
    </div>

  </div>




  <!-- Modal -->
  <div class="modal fade" id="elementModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Crear nueva nota</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="title" class="col-form-label">Titulo nota:</label>
              <input type="text" class="form-control" id="title">
            </div>
            <div class="mb-3">
              <label for="sizeCol">Elige el tamaño:</label>

              <select name="col" id="sizeCol">
                <option value="col-2">small</option>
                <option value="col-4">medium</option>
                <option value="col-6">large</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="colorNote">Color de la nota</label>

              <select name="color" id="colorNote">
                <option value="card text-bg-primary mb-3">Azul</option>
                <option value="card text-bg-success mb-3">Verde</option>
                <option value="card text-bg-warning mb-3">Amarillo</option>
                <option value="card text-bg-danger mb-3">Rojo</option>
              </select>
            </div>

          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-guardar bg-primary text-white" id="btn-save-element"
            data-bs-dismiss="modal">Guardar</button>
        </div>
      </div>
    </div>
  </div>


  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>
  <script src="examenClase.js"></script>

</body>

</html>
