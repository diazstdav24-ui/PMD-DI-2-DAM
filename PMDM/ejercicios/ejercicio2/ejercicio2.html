<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Counter</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-light min-vh-100">
    <header class="bg-dark text-white py-4 shadow-sm mb-5">
      <div class="container text-center">
        <h1 class="h2 mb-1">Character Counter</h1>
        <p class="mb-0 text-white-50">
          Escribe tu texto y controla cuántos caracteres llevas
        </p>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="row justify-content-between mb-4 g3">
          <div class="card col-md-2 col-sm-5 shadow border-0 mb-4">
            <div class="card-body">
              <h5 class="card-title fw-semibold">Caracteres</h5>
              <p id="contador">0</p>
            </div>
          </div>

          <div class="card col-md-2 col-sm-5 shadow border-0 mb-4">
            <div class="card-body">
              <h5 class="card-title fw-semibold">Palabras</h5>
              <p id="contador-palabras">0</p>
            </div>
          </div>

          <div class="card col-md-2 col-sm-5 shadow border-0 mb-4">
            <div class="card-body">
              <h5 class="card-title fw-semibold">Saltos de línea</h5>
              <p id="contador-saltos">0</p>
            </div>
          </div>

          <div class="card col-md-2 col-sm-5 shadow border-0 mb-4">
            <div class="card-body">
              <h5 class="card-title fw-semibold">Sin espacios</h5>
              <p id="contador-sinEspacios">0</p>
            </div>
          </div>
        </div>

        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8">
            <div class="card shadow border-0">
              <div class="card-body p-4">
                <label for="boxText" class="form-label fw-semibold"
                  >Tu texto</label
                >
                <textarea
                  name="boxText"
                  id="boxText"
                  class="form-control"
                  rows="6"
                  placeholder="Escribe aquí..."
                ></textarea>
                <div
                  class="d-flex justify-content-between align-items-center mt-3"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="ejercicio2.js"></script>
  </body>
</html>
