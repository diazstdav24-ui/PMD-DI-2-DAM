<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ListaTareas</title>

    <!-- Ejercicio: Generador visual de tableros Kanban

    Haz una lista de tareas con HTML y jQuery. Bootstrap es opcional y solo para que no se vea feo: un container y poco más. Lo importante es el JS. La página tiene un campo de texto, un botón "Añadir" y una lista vacía. Deberán programarse estos controles:

    Al pulsar "Añadir", la tarea escrita aparece como un nuevo elemento de la lista.
    Cada tarea tiene un botón "Eliminar" que la borra.
    Al hacer clic sobre el texto de una tarea, se marca como completada (tachada). Si vuelves a hacer clic, se desmarca.
    Si el campo está vacío, no se añade nada.
    Después de añadir, el campo se vacía y el cursor vuelve a él..   -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      li {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container jus mt-3">
      <ul class="list-group" id="list-group">
        <li
          class="list-group-item d-flex justify-content-between align-items-center"
        >
          <span class="texto-tarea">first item</span>
          <button type="button" class="btn btn-sm btn-danger btn-eliminar">
            Eliminar
          </button>
        </li>
        <li
          class="list-group-item d-flex justify-content-between align-items-center"
        >
          <span class="texto-tarea">second item</span>
          <button type="button" class="btn btn-sm btn-danger btn-eliminar">
            Eliminar
          </button>
        </li>
        <li
          class="list-group-item d-flex justify-content-between align-items-center"
        >
          <span class="texto-tarea">third item</span>
          <button type="button" class="btn btn-sm btn-danger btn-eliminar">
            Eliminar
          </button>
        </li>
      </ul>

      <div class="input-group mt-5 w-50 mx-auto">
        <button
          class="btn btn-outline-secondary"
          type="button"
          id="button-addon1"
        >
          Button
        </button>
        <input
          type="text"
          class="form-control"
          id="input-text"
          placeholder=""
          aria-label="Example text with button addon"
          aria-describedby="button-addon1"
        />
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="ejercicioEjemplo.js"></script>
  </body>
</html>
