<div class="card h-100 shadow-sm person-card text-center">
  <div class="card-body d-flex flex-column align-items-center">
    <div class="avatar mb-3">{{ people()?.name?.charAt(0) }}</div>
    <h5 class="card-title">{{ people()?.name }}</h5>
    {{ people() }}
    <p class="card-text text-body-secondary mb-3">{{ people()?.gender }}</p>
    <a class="btn btn-primary mt-auto" routerLink="['/person-detail', people()?.id]">Ver detalle</a>
  </div>
</div>
