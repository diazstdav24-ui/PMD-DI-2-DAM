<div class="card" style="width: 18rem">
  <div class="card-body">
    <h5 class="card-title">{{ vehicle()?.name }}</h5>
    <h6 class="card-subtitle mb-2 text-body-secondary">Model {{ vehicle()?.model }}</h6>
    <p class="card-text">Vehicle Class {{ vehicle()?.vehicle_class }}</p>
    <button type="button" class="btn btn-primary" (click)="emitVehicleClicked()">
      view details
    </button>
  </div>
</div>
