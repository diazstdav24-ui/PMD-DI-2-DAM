<div class="card" style="width: 18rem">
  <div class="card-body">
    <h5 class="card-title">{{ episode()?.name }}</h5>
    <h6 class="card-subtitle mb-2 text-body-secondary">{{ episode()?.air_date }}</h6>
    <p class="card-text">{{ episode()?.episode }}</p>
    <button type="button" class="btn-solid theme-primary" (click)="emitEpisodeClicked()">
      View detail
    </button>
  </div>
</div>
