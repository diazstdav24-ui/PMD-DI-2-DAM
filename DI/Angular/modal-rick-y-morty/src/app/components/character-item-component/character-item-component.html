<section class="card" style="max-width: 320px">
    <img [src]="`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${getPokemonId()}.png`"
        class="card-img-top" alt="...">
    <div class="card-body">
        <h4 class="card-title">{{character()?.name}}</h4>
        <p class="card-text">({{character()?.origin}})</p>
        <!-- STEP7: defino un evento clic sobre el botón que quiero que lance un evento de salida, es decir, output al componente padre para que este realice la acción que en este caso sería abrir un modal con la información del Pokémon sobre el que he hecho click-->
        <button type="button" class="btn-solid theme-primary" (click)="emitCharacterClicked()">View detail</button>
    </div>
</section>
