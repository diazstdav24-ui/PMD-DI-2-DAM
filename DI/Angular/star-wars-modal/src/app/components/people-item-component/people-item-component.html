<div class="card" style="width: 18rem">
  <img class="card-img-top" [src]="people()?.url" alt="Card image cap" />
  <div class="card-body">
    <h5 class="card-title">{{ people()?.name }}</h5>
    <p class="card-text">
      {{ people()?.created }}
    </p>
  </div>
  <button type="button" class="btn-solid theme-primary" (click)="emitPeopleClicked()"> <!--Llama al emit-->
    View detail
  </button>
</div>
